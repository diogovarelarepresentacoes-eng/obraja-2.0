version: '3.9'

networks:
  n8n_default:
    external: true
  obraja_default:
    external: true

services:
  obraja-api:
    image: obraja-api:latest
    container_name: obraja_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://obraja:obraja_prod_2024@obraja_postgres:5432/obraja2
      REDIS_URL: redis://obraja_redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
    networks:
      - n8n_default
      - obraja_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obraja-api.rule=Host(`api.srv1131489.hstgr.cloud`)"
      - "traefik.http.routers.obraja-api.entrypoints=websecure"
      - "traefik.http.routers.obraja-api.tls.certresolver=myresolver"
      - "traefik.http.services.obraja-api.loadbalancer.server.port=3001"
      - "traefik.docker.network=n8n_default"

  obraja-marketplace:
    image: obraja-marketplace:latest
    container_name: obraja_marketplace
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: https://api.srv1131489.hstgr.cloud/api/v1
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obraja-marketplace.rule=Host(`obraja.srv1131489.hstgr.cloud`)"
      - "traefik.http.routers.obraja-marketplace.entrypoints=websecure"
      - "traefik.http.routers.obraja-marketplace.tls.certresolver=myresolver"
      - "traefik.http.services.obraja-marketplace.loadbalancer.server.port=3000"
      - "traefik.docker.network=n8n_default"
